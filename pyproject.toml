[tool.poetry]
name = "cost-optimizer-engine"
version = "0.1.0"
description = "ML-driven cost optimization for fintech"
authors = ["You infrastructure.swati@gmail.com"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
boto3 = "^1.29.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
scikit-learn = "^1.3.2"
xgboost = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"
responses = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
